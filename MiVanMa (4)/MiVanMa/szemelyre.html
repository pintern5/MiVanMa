<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="auth.css">
  <title>Személyre szabott – MiVanMa</title>


  <link rel="icon" href="favicon.ico">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: #f3f4f6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    main {
      flex: 1;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px;
    }

    footer {
      margin-top: 60px;
      padding: 24px;
      text-align: center;
      background: #7f1d1d;
      color: #fee2e2;
      font-size: 0.85rem;
    }

    /* ===== HERO ===== */

    .personal-hero {

      background: linear-gradient(135deg, #7f1d1d, #991b1b);

      color: white;

      padding: 40px;

      border-radius: 18px;

      margin-bottom: 30px;

      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);

    }

    .personal-hero h1 {

      margin: 0;
      font-size: 2.2rem;

    }

    .personal-hero p {

      margin-top: 10px;
      opacity: 0.9;

    }


    /* ===== GRID ===== */

    .grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

      gap: 20px;

    }


    /* ===== CARD ===== */

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid #eee;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      transition: .25s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(127, 29, 29, .1), transparent);
      opacity: 0;
      transition: .25s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h3 {

      margin-top: 0;

    }




    .tag {
      display: inline-block;
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      color: white;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: .3px;
    }


    /* ===== EMPTY STATE ===== */

    .empty {

      text-align: center;

      margin-top: 50px;

      background: var(--card);

      padding: 40px;

      border-radius: 16px;

      border: 1px solid var(--border);

    }

    .empty h2 {

      margin-top: 0;

    }

    .empty button {

      margin-top: 15px;

      background: linear-gradient(135deg, #7f1d1d, #991b1b);

      color: white;

      border: none;

      padding: 10px 18px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 15px;

    }

    .empty button:hover {

      opacity: 0.9;

    }


    /* ===== FOOTER ===== */

    footer {

      margin-top: 60px;

      padding: 30px;

      text-align: center;

      color: #6b7280;

    }

    * {
      box-sizing: border-box;
    }

    header {
      width: 100%;
    }

    .topbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      outline: none;
      transition: .2s;
    }

    .search input:focus {
      border-color: #7f1d1d;
      background: white;
    }

    .personal-hero {
      animation: fadeIn .7s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .search {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      z-index: 999;
      display: none;
    }

    .search-results.show {
      display: block;
    }

    .search-result-item {
      display: block;
      padding: 14px 16px;
      text-decoration: none;
      color: #111;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.2s ease;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: #f9fafb;
    }

    .search-result-category {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #991b1b;
      margin-bottom: 6px;
    }

    .search-result-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .search-result-desc {
      font-size: 0.84rem;
      color: #6b7280;
      line-height: 1.4;
    }

    .search-no-result {
      padding: 14px 16px;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    /* ===== GAMING CARD ===== */
    .gaming-card {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      border: 1px solid #c7d2fe;
    }

     .category-news {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
/* ===== HÍREK ELRENDEZÉSE ===== */

#allNews {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
  margin-top: 25px;
}

/* ===== KÁRTYA ===== */

#allNews .card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 420px;

  background: white;
  border-radius: 20px;
  overflow: hidden;

  border: 1px solid #e5e7eb;

  box-shadow: 0 10px 25px rgba(0,0,0,0.08);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

#allNews .card:hover {
  transform: translateY(-6px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.12);
}

/* ===== KÉP ===== */

.card-image {
  width: 100%;
  height: 200px;
  object-fit: cover;

  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
}

/* ===== SZÖVEG ===== */

#allNews .card h3 {
  font-size: 1.2rem;
  margin: 18px 18px 10px;
  color: #111827;
  line-height: 1.35;
}

#allNews .card p {
  margin: 0 18px 20px;
  color: #4b5563;
  line-height: 1.6;
  font-size: 0.95rem;

  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===== RESZPONZÍV ===== */

@media (max-width: 700px) {
  #allNews {
    grid-template-columns: 1fr;
  }

  .card-image {
    height: 180px;
  }
}
  </style>

</head>

<body>



  <!-- NAVBAR -->

  <header>
    <div class="topbar">
      <a href="fo.html" class="logo" style="display:flex;align-items:center;gap:8px;">
        <img src="logo.png" style="height:28px;">
        <span>MiVanMa</span>
      </a>

      <div class="search">
        <input type="text" id="newsSearch" placeholder="Keresés a hírek között…" autocomplete="off" />
        <div id="searchResults" class="search-results"></div>
      </div>

      <div class="nav">
        <a href="fo.html" class="nav-link">Friss</a>
        <a href="szemelyre.html" class="nav-link">Személyre szabott</a>
        <a href="rolunk.html" class="nav-link">Rólunk</a>
        <button id="loginBtn" class="primary">Bejelentkezés</button>
      </div>
    </div>
  </header>




  <!-- MAIN -->

  <main>


    <!-- HERO -->

    <section class="personal-hero">

      <h1>🎯 Személyre szabott hírek</h1>

      <p>

        Itt jelennek meg a számodra legérdekesebb hírek.

        Minél többet használod a MiVanMa-t, annál pontosabb lesz.

      </p>

    </section>




    <!-- GRID -->

    <div id="personalNews"></div>









    <!-- EMPTY -->

    <div class="empty">

      <h2>🚀 Ez még csak a kezdet</h2>

      <p>

        Ez az oldal a jövőben teljesen személyre szabott lesz.

      </p>

      <button onclick="window.location.href='profil.html'">

        Profil beállítása
        </button>


        <div id="allNews" class="row">
          <!-- IDE bemásolod a fo.html category-line blokkjait -->
        </div>


  </main>



  <!-- FOOTER -->

  <footer>

    © 2026 MiVanMa – Minden jog fenntartva

  </footer>
  <script src="auth.js"></script>


  <script>

    // ===== Kedvencek lekérése =====
    function getUserFavorites() {
      try {
        const favs = localStorage.getItem('favorites'); // profil oldalon mentett kedvencek
        return favs ? JSON.parse(favs) : [];
      } catch (e) {
        console.error("Hiba a kedvencek lekérésekor:", e);
        return [];
      }
    }
    getUserFavorites()


    // ===== Személyre szabott hírek betöltése =====
    function loadPersonalNews() {
      const container = document.getElementById("personalNews");
      const allNews = document.getElementById("allNews");
      const emptyDiv = document.querySelector(".empty");
      const newsData = JSON.parse(localStorage.getItem("newsData"))
      console.log(newsData);
      


      if (!container || !allNews) return;

      container.innerHTML = "";

      const userFavorites = getUserFavorites(); // pl. ['gaming','tech']

      if (!userFavorites.length) {
        // nincs kedvenc, üres állapot látszik
        return;
      }

      const result = Object.entries(newsData)
        .filter(([key]) =>
          userFavorites.some(fav => key.startsWith(fav))
        )
        .map(([, value]) => value);

      console.log(result); // ["X", "Y", "Z"]
      result.map((news) => {
        allNews.innerHTML += `
            <div class="card">
              <h3>${news.title}</h3>
              <p>${news.content}</p>
              <img class="card-image" src="images/tech1.webp" alt="Mesterséges intelligencia és technológia">
            </div>
          </a>`
      })

      const categories = allNews.querySelectorAll(".category-line");
      categories.forEach(cat => {
        // kategória neve a class-ból
        const catClass = Array.from(cat.classList).find(c => c.endsWith("-line"));
        if (!catClass) return;
        const catName = catClass.replace("-line", "");
        if (userFavorites.includes(catName)) {
          container.appendChild(cat.cloneNode(true));
        }
      });

      // ha van megjelenítendő hír, elrejtjük az empty blokkot
      if (container.children.length > 0 && emptyDiv) {
        emptyDiv.style.display = "none";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadPersonalNews();
    });
  </script>




</body>

</html>
