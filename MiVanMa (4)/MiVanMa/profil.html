<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil beállítása – MiVanMa</title>

<link rel="stylesheet" href="auth.css">

<style>

* { box-sizing: border-box; }

  header { width: 100%; }

  .topbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .search { flex: 1; }

main{

max-width:800px;
margin:40px auto;
padding:0 16px;

}


.profile-box {
  background: var(--card);
  padding: 35px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08);
  animation: fadeIn .5s ease;
}


.profile-box h1{

margin-top:0;

}


.section{

margin-top:25px;

}


.section h3{

margin-bottom:10px;

}


.checkbox-group{

display:grid;
grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
gap:10px;

}


.checkbox-group label{

background:#f3f4f6;
padding:10px;
border-radius:8px;
cursor:pointer;

}



button.save:hover{

opacity:0.9;

}


footer{

margin-top:60px;
padding:30px;
text-align:center;
color:#6b7280;

}

.search input{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  outline:none;
  transition:.2s;
}

.search input:focus{
  border-color:#7f1d1d;
  background:white;
}

.interest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 12px;
}

.interest {
  padding: 14px;
  border-radius: 12px;
  background: #f3f4f6;
  text-align: center;
  cursor: pointer;
  font-weight: 600;
  transition: .2s;
  border: 2px solid transparent;
}

.interest:hover {
  transform: translateY(-2px);
}

.interest.active {
  background: linear-gradient(135deg,#7f1d1d,#991b1b);
  color: white;
  border-color: #7f1d1d;
  box-shadow: 0 10px 25px rgba(127,29,29,0.3);
}

.save {
  margin-top: 35px;
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg,#7f1d1d,#991b1b);
  color: white;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: .2s;
}

.success-msg {
  margin-top: 15px;
  color: green;
  font-weight: 600;
  display: none;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(10px); }
  to { opacity:1; transform:translateY(0); }
}

</style>

</head>
<body>


<!-- NAVBAR -->

<header>
  <div class="topbar">
    <a href="fo.html" class="logo" style="display:flex;align-items:center;gap:8px;">
      <img src="logo.png" style="height:28px;">
      <span>MiVanMa</span>
    </a>

    <div class="search">
      <input type="text" placeholder="Keresés a hírek között…">
    </div>

    <div class="nav">
      <a href="fo.html" class="nav-link">Friss</a>
      <a href="szemelyre.html" class="nav-link">Személyre szabott</a>
      <a href="rolunk.html" class="nav-link">Rólunk</a>
      <button id="loginBtn" class="primary">Bejelentkezés</button>
    </div>
  </div>
</header>

</nav>

</div>

</header>



<!-- MAIN -->

<main>


<div class="profile-box">

  <h1>⚙️ Profil beállítása</h1>
  <p>Válaszd ki milyen témák érdekelnek:</p>

  <div class="section">
    <h3>Érdeklődési körök</h3>

    <div class="interest-grid" id="interestGrid">
      <div class="interest" data-value="tech">💻 Tech</div>
      <div class="interest" data-value="sport">⚽ Sport</div>
      <div class="interest" data-value="gaming">🎮 Gaming</div>
      <div class="interest" data-value="auto">🚗 Autók</div>
      <div class="interest" data-value="kozelet">🏛️ Közélet</div>
    </div>

  </div>

  <button class="save" id="saveBtn">
    Mentés
  </button>

  <div class="success-msg" id="successMsg">
    ✔ Sikeresen mentve!
  </div>

</div>

</main>



<!-- FOOTER -->

<footer>

© 2026 MiVanMa

</footer>

<script src="auth.js"></script>

<script>
  //ellenőrzés
  if (!localStorage.getItem("isLoggedIn")) {
    alert ("Kérjük jelentkezz be!")
    location.href = "fo.html"
  }
  const interests = document.querySelectorAll(".interest");
  const saveBtn = document.getElementById("saveBtn");
  const successMsg = document.getElementById("successMsg");

  let selected = JSON.parse(localStorage.getItem("interests")) || [];

  // ===== BETÖLTÉS (ha már volt mentve)
  interests.forEach(el => {
    const value = el.dataset.value;

    if (selected.includes(value)) {
      el.classList.add("active");
    }

    // ===== KATTINTÁS
    el.addEventListener("click", () => {
      el.classList.toggle("active");

      if (selected.includes(value)) {
        selected = selected.filter(i => i !== value);
      } else {
        selected.push(value);
      }
    });
  });

  // ===== MENTÉS
  saveBtn.addEventListener("click", () => {

    // ha semmi nincs kiválasztva
    if (selected.length === 0) {
      alert("Válassz ki legalább egy kategóriát!");
      return;
    }

    localStorage.setItem("favorites", JSON.stringify(selected));
    

    successMsg.style.display = "block";

    // kis delay + redirect
    setTimeout(() => {
      window.location.href = "szemelyre.html";
    }, 800);
  });
</script>

</body>
</html>

<!-- mentés után dobjon vissza a személyre szabott aloldalra és dobáljon fel abban a kategóriában hireket -->
